// Mouse Aim Flight Redux flight modes, cycled in flight with the mode key in the order
// they appear here. Each is a set of limits and response times for the same
// controller, so a mode can be changed or added here or through ModuleManager.
//
// Rates are in degrees per second, angles in degrees, times in seconds.
// controlLag is how long the control surfaces take to follow an input, and
// controlGain how much of each correction the controller makes at once: lower
// it if an axis wobbles, raise it if an axis is slow to respond.
// maxG limits the pull; pushing is limited to half of it. The bank commits to
// the aim between bankBlendStart and bankBlendEnd degrees off the nose, and
// holds the wings level below that. Every key is described in docs/DESIGN.md
// in the source repository: https://github.com/aspctt/MouseAimFlightRedux

MOUSE_AIM_FLIGHT_REDUX_MODE
{
	name = Normal
	maxPitchRate = 25
	maxYawRate = 10
	maxRollRate = 120
	maxG = 6
	maxAoA = 18
	maxNegativeAoA = 8
	maxBank = 180
	bankBlendStart = 3
	bankBlendEnd = 20
	attitudeResponse = 0.4
	rateResponse = 0.15
	controlLag = 0.12
	controlGain = 0.7
}

MOUSE_AIM_FLIGHT_REDUX_MODE
{
	name = Cruise
	maxPitchRate = 10
	maxYawRate = 5
	maxRollRate = 45
	maxG = 3
	maxAoA = 10
	maxNegativeAoA = 5
	maxBank = 45
	bankBlendStart = 5
	bankBlendEnd = 30
	attitudeResponse = 0.8
	rateResponse = 0.25
	controlLag = 0.12
	controlGain = 0.6
}

MOUSE_AIM_FLIGHT_REDUX_MODE
{
	name = Aggressive
	maxPitchRate = 45
	maxYawRate = 20
