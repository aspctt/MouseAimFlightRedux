// Mouse Aim Flight Redux flight modes. Mouse aim starts in the first, and the
// mode key cycles through them in this order. Change them or add your own here,
// or with ModuleManager, then press "Reload flight modes from disk" in the
// settings window to try them.
//
// Rates are in degrees per second, angles in degrees, times in seconds.
// - maxG limits pulling; pushing gets half. 0 means no limit.
// - The wings stay level until the aim is bankBlendStart degrees off the nose,
//   and the plane banks fully into the turn past bankBlendEnd.
// - controlLag is how long the control surfaces take to respond.
// - Lower controlGain if an axis wobbles, raise it if an axis is sluggish.
// - brakingShare is how much of the craft's turning power it counts on to stop
//   on target. Higher turns faster, but overshoots if the craft can't deliver.
//
// Every key: https://github.com/aspctt/MouseAimFlightRedux/blob/main/docs/DESIGN.md

MOUSE_AIM_FLIGHT_REDUX_MODE
{
	name = Normal
	maxPitchRate = 25
	maxYawRate = 10
	maxRollRate = 120
	maxG = 6
	maxAoA = 18
	maxNegativeAoA = 8
	maxBank = 180
	bankBlendStart = 3
	bankBlendEnd = 20
	attitudeResponse = 0.4
	rateResponse = 0.15
	controlLag = 0.12
	controlGain = 0.7
	brakingShare = 0.5
}

MOUSE_AIM_FLIGHT_REDUX_MODE
{
	name = Aggressive
	maxPitchRate = 45
	maxYawRate = 20
	maxRollRate = 240
	maxG = 10
	maxAoA = 28
	maxNegativeAoA = 12
	maxBank = 180
	bankBlendStart = 2
	bankBlendEnd = 12
	attitudeResponse = 0.25
	rateResponse = 0.1
	controlLag = 0.12
	controlGain = 0.8
	brakingShare = 0.5
}

// No load limit, and the angle of attack limit at 30 degrees, where stock wings
// make the most lift. Past that they lose lift and gain a lot of drag. With G
// limits on in the difficulty options, parts can break and pilots black out.
MOUSE_AIM_FLIGHT_REDUX_MODE
{
	name = Unlimited
	maxPitchRate = 90
	maxYawRate = 40
	maxRollRate = 360
	maxG = 0
	maxAoA = 30
	maxNegativeAoA = 30
	maxBank = 180
	bankBlendStart = 1.5
	bankBlendEnd = 8
	attitudeResponse = 0.2
	rateResponse = 0.1
	controlLag = 0.12
	controlGain = 0.9
	brakingShare = 0.75
}

